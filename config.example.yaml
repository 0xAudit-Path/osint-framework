apis:
  groq: "API_KEY_GROQ"
  shodan: "API_KEY_SHODAN"
  hibp: "API_KEY_HIBP"  # opcional — planes desde ~3€/mes en haveibeenpwned.com/API/Key
                          # sin key se usa BreachDirectory a través de RapidAPI.
  breachdirectory: "RAPIDAPI_KEY"  # clave de BreachDirectory en RapidAPI
  breachdirectory_host: "breachdirectory.p.rapidapi.com"
  twitter: "API_KEY_TWITTER" #opcional — bearer token gratuito en developer.twitter.com
                             # sin token se usan Google Dorks como fallback
  github: "API_KEY_GITHUB"
  censys_id: "API_KEY_CENSYS_ID"
  censys_secret: "API_KEY_CENSYS_SECRET"


ai:
  enabled: true
  provider: "groq"
  model: "MODEL_NAME"
  #base_url: "http://localhost:11434" # Ollama utiliza un puerto local para la API, por defecto 11434
  features:
    executive_summary: true
    correlations: true
    dork_generation: true
    chat: true


