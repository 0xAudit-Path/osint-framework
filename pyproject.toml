[tool.poetry]
name = "osint-framework"
version = "0.1.0"
description = "Framework modular de reconocimiento OSINT"
authors = ["0xAudit-Path"]
license = "MIT"
readme = "README.md"
packages = [{include = "osint"}]
homepage = "https://github.com/0xAudit-Path/osint-framework"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"
pyyaml = "^6.0"
rich = "^15.0.0"
structlog = "^25.5.0"
dnspython = "^2.8.0"
aiodns = "^4.0.0"
cryptography = "^48.0.0"
python-whois = "^0.9.6"
ipwhois = "^1.3.0"
aiohttp = "^3.14.1"
tweepy = "^4.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.9"

[tool.poetry.scripts]
osint = "osint.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"